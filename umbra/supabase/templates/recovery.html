<!doctype html>
<html lang="es">
<body style="margin:0;background:#f4f4ee;color:#17201b;font-family:Georgia,'Times New Roman',serif">
  <!-- El nombre de la comunidad está escrito en este archivo: cámbialo aquí y en el panel de Supabase si renombras el proyecto. -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4ee">
    <tr><td align="center" style="padding:48px 20px">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px">
        <tr><td style="font-family:'Courier New',monospace;font-size:12px;letter-spacing:5px;color:#1f5c45">UMBRA</td></tr>
        <tr><td style="padding-top:36px;font-size:32px;line-height:1.15;color:#17201b">Recupera tu acceso.</td></tr>
        <tr><td style="padding-top:18px;font-size:17px;line-height:1.6;color:#3c4640">
          Has pedido crear una contraseña nueva. El enlace caduca en una hora.
        </td></tr>
        <tr><td style="padding-top:30px">
          <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/nueva-contrasena"
             style="display:inline-block;background:#1f5c45;color:#ffffff;text-decoration:none;font-family:Arial,sans-serif;font-size:15px;padding:14px 24px;border-radius:2px">
            Crear contraseña nueva
          </a>
        </td></tr>
        <tr><td style="padding-top:30px;font-family:Arial,sans-serif;font-size:13px;line-height:1.6;color:#5f6862">
          Si no lo has pedido tú, ignora este mensaje: tu contraseña no cambiará.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
